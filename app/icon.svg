<svg width="180" height="180" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- L Gradient: Deep architectural emerald -->
    <linearGradient id="lr-fav-L" x1="20" y1="20" x2="60" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- R Gradient: Radiant luminous emerald -->
    <linearGradient id="lr-fav-R" x1="40" y1="20" x2="85" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadow between layers -->
    <filter id="lr-fav-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Ambient Glow -->
    <radialGradient id="lr-fav-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Badge with Emerald Border -->
  <rect x="3" y="3" width="94" height="94" rx="22" fill="#090a0f" stroke="#10b981" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="3" y="3" width="94" height="94" rx="22" fill="url(#lr-fav-glow)"/>

  <!-- Layer 1: Structural 'L' -->
  <path d="M26 24V76H52" stroke="url(#lr-fav-L)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Layer 2: Dynamic 'R' with Drop Shadow -->
  <g filter="url(#lr-fav-shadow)">
    <path d="M50 24V76" stroke="url(#lr-fav-R)" stroke-width="10" stroke-linecap="round"/>
    <path d="M50 24H67C76.5 24 82 29.5 82 38C82 46.5 76.5 52 67 52H50" stroke="url(#lr-fav-R)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M63 52L81 76" stroke="url(#lr-fav-R)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Layer 3: AI Neural Node -->
  <circle cx="67" cy="38" r="4.5" fill="#10b981" fill-opacity="0.5"/>
  <circle cx="67" cy="38" r="2.5" fill="#a7f3d0"/>
  <circle cx="67" cy="38" r="1.2" fill="#ffffff"/>
</svg>