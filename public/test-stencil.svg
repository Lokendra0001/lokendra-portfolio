<svg viewBox='0 0 100 100' fill='none' xmlns='http://www.w3.org/2000/svg'>
  <defs>
    <!-- Emerald Gradient -->
    <linearGradient id='sp-emerald' x1='15%' y1='10%' x2='85%' y2='90%'>
      <stop offset='0%' stop-color='#6ee7b7'/>
      <stop offset='40%' stop-color='#10b981'/>
      <stop offset='100%' stop-color='#047857'/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id='sp-accent' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#a7f3d0'/>
      <stop offset='100%' stop-color='#34d399'/>
    </linearGradient>
    
    <radialGradient id='sp-glow' cx='50%' cy='50%' r='60%'>
      <stop offset='0%' stop-color='#10b981' stop-opacity='0.25'/>
      <stop offset='100%' stop-color='#10b981' stop-opacity='0'/>
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Shield Badge -->
  <rect x='3' y='3' width='94' height='94' rx='22' fill='#090a0f' stroke='#10b981' stroke-opacity='0.35' stroke-width='1.5'/>
