<svg width='100' height='100' viewBox='0 0 100 100' fill='none' xmlns='http://www.w3.org/2000/svg'>
  <defs>
    <linearGradient id='lr-grad' x1='20' y1='20' x2='80' y2='80' gradientUnits='userSpaceOnUse'>
      <stop offset='0%' stop-color='#34d399'/>
      <stop offset='50%' stop-color='#10b981'/>
      <stop offset='100%' stop-color='#059669'/>
    </linearGradient>
    <radialGradient id='lr-glow' cx='50%' cy='50%' r='65%'>
      <stop offset='0%' stop-color='#10b981' stop-opacity='0.25'/>
      <stop offset='100%' stop-color='#10b981' stop-opacity='0'/>
    </radialGradient>
  </defs>

  <!-- Background Squircle Badge -->
  <rect x='3' y='3' width='94' height='94' rx='22' fill='#090a0f' stroke='#10b981' stroke-opacity='0.3' stroke-width='1.5'/>
  <rect x='3' y='3' width='94' height='94' rx='22' fill='url(#lr-glow)'/>

  <!-- Connected Continuous Ligature -->
  <!-- L Stem and Base connecting into R Spine -->
  <path d='M26 24V76H48V24' stroke='url(#lr-grad)' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/>
  
  <!-- R Loop -->
  <path d='M48 24H65C74.5 24 80 29.5 80 38C80 46.5 74.5 52 65 52H48' stroke='url(#lr-grad)' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/>
  
  <!-- R Forward Kick -->
  <path d='M60 52L78 76' stroke='url(#lr-grad)' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/>
</svg>